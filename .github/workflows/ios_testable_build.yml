name: "Build iOS Testable IPA"

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-ios:
    name: Build Testable iOS IPA
    runs-on: macos-14 # Uses Apple Silicon M-series runners

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Disable Swift Package Manager (Force CocoaPods)
        run: flutter config --no-enable-swift-package-manager

      - name: Precache iOS Artifacts
        run: flutter precache --ios

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Cache CocoaPods Specs & Pods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Build iOS Application (Unsigned / Testable)
        run: |
          set -o pipefail
          echo "Starting iOS build without code signing..."
          # Filter out CocoaPods CDN lines so real compilation output and errors are immediately visible
          flutter build ios --no-codesign --release 2>&1 | tee build_ios.log | grep -v "CDN: trunk" || {
            echo "❌ BUILD FAILED! Last 100 lines of build log:"
            tail -n 100 build_ios.log
            exit 1
          }

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-ios-log
          path: build_ios.log

      - name: Package into IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r RudraClasses-Testable.ipa Payload

      - name: Upload Testable IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RudraClasses-iOS-Testable-IPA
          path: build/ios/iphoneos/RudraClasses-Testable.ipa

      - name: Upload Runner.app
        uses: actions/upload-artifact@v4
        with:
          name: RudraClasses-iOS-Runner-App
          path: build/ios/iphoneos/Runner.app
